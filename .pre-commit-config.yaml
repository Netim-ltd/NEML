#
# Local gates for NEML_SPEC.md §0.8 + §18.2. The CI pipeline runs the same
# checks plus the ones that need a built workspace (dotnet, flutter, URDF,
# genome schema, sim regression) — those are deliberately not here.

default_install_hook_types: [pre-commit]
exclude: '^(NEML_SPEC\.md|LICENSE|docs/api/)'

repos:
  - repo: local
    hooks:
      # §18.2 gate 4 — copyright header on every file.
      - id: copyright-header
        name: copyright header (SPEC 1.2)
        language: system
        types: [text]
        # Skipped: files that cannot carry a comment (JSON, ARB), lockfiles,
        # ament resource-index markers that must stay zero bytes, and
        # tool-generated platform scaffolding nobody hand-edits
        # (`flutter create`, Xcode, Gradle wrapper, .sln). Everything a human
        # writes is checked. Keep this list short and in step with ci.yml.
        exclude: |
          (?x)^(
            .*\.json
            | .*\.arb
            | .*\.lock
            | .*\.sln
            | .*\.gitkeep
            | ros2_ws/src/[^/]+/resource/.*
            | .*/py\.typed
            | mobile/(?!lib/|test/|pubspec\.yaml|analysis_options\.yaml).*
          )$
        entry: >-
          bash -c 'rc=0; for f in "$@"; do
          head -n 5 "$f" | grep -qF "Copyright (c) 2026 Mustafa Gulsoy." ||
          { echo "missing copyright header: $f"; rc=1; }; done; exit $rc' --

      # §18.2 gate 8 / §1.3 — no third-party GPL/AGPL/LGPL source in this tree (our own AGPL header is allowed).
      - id: no-copyleft-source
        name: no GPL/AGPL source in tree (SPEC 1.3)
        language: system
        types: [text]
        entry: >-
          bash -c 'rc=0; for f in "$@"; do
          grep -nEi "SPDX-License-Identifier:[[:space:]]*(A|L)?GPL|under the terms of the GNU (General|Lesser|Affero)" "$f" | grep -v "AGPL-3.0-or-later" | grep -q . &&
          { echo "copyleft license header in: $f"; rc=1; }; done; exit $rc' --

      # §18.2 gate 1 — mypy runs on the brain package only, from the project
      # venv so it sees brain/ dependencies. ponytail: needs `uv sync` in
      # brain/ first; switch to mirrors-mypy with pinned stubs if that bites.
      - id: mypy-brain
        name: mypy --strict (brain)
        language: system
        pass_filenames: false
        files: '^brain/'
        entry: mypy --strict brain/neml_brain

  # §18.2 gate 1 — lint + format.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # §18.2 gate 1 — security lint. Tests are asserts, not findings.
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.10
    hooks:
      - id: bandit
        args: [-q]
        exclude: '(^|/)tests/'

  # §18.2 gate 9 — secret scan.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
