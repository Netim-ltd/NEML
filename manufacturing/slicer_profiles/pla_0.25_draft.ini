#
# NEML_SPEC.md 12.4 - PLA, 0.25 mm layer, draft. Fit checks, jigs, throwaway
# geometry checks before a part is committed to PETG or PA6-CF.
#   prusa-slicer --export-gcode --load pla_0.25_draft.ini --output out.gcode in.3mf
#
# SPEC 12.3 consistency:
#   min wall 1.2 mm   <- 2 perimeters. At 0.45 mm each that is 0.90 mm of fixed
#                        wall, and arachne widens the two beads to 0.60 mm to
#                        fill a 1.2 mm wall solidly - no gap, no infill inside
#                        it. A draft part does not need a third perimeter; a
#                        structural one does, which is why the two structural
#                        profiles carry 3 and 4.
#   nozzle 0.4 mm     <- nozzle_diameter; min_feature_size holds the detail rule
#   volume 250x210x220 <- bed_shape + max_print_height
#   layer 0.25         <- 62% of the nozzle, the fastest layer that still bonds
# Purpose: draft. NEVER load-bearing and never on the robot: PLA creeps at room
# temperature under load and softens around 55 C.

print_settings_id = neml_pla_0.25_draft
filament_settings_id = neml_pla
printer_settings_id = neml_mk4_0.4

# ------------------------------------------------------------------ printer
printer_technology = FFF
printer_model = MK4
gcode_flavor = marlin2
nozzle_diameter = 0.4
bed_shape = 0x0,250x0,250x210,0x210
max_print_height = 220
min_layer_height = 0.07
max_layer_height = 0.3
filament_diameter = 1.75
use_relative_e_distances = 1
retract_length = 0.8
retract_speed = 35
retract_lift = 0.2
retract_before_travel = 1.5
start_gcode = M104 S[first_layer_temperature]\nM140 S[first_layer_bed_temperature]\nM190 S[first_layer_bed_temperature]\nM109 S[first_layer_temperature]\nG28 ; home\nG29 ; mesh bed levelling\nG92 E0
end_gcode = M104 S0\nM140 S0\nG1 X0 Y200 F3000\nM84

# -------------------------------------------------------------------- print
layer_height = 0.25
first_layer_height = 0.25
perimeters = 2
perimeter_generator = arachne
thin_walls = 1
gap_fill_enabled = 1
min_feature_size = 0.4
top_solid_layers = 3
bottom_solid_layers = 3
fill_density = 15%
fill_pattern = gyroid
top_fill_pattern = monotonic
bottom_fill_pattern = monotonic
extrusion_width = 0.45
first_layer_extrusion_width = 0.42
perimeter_extrusion_width = 0.45
external_perimeter_extrusion_width = 0.45
infill_extrusion_width = 0.5
solid_infill_extrusion_width = 0.45
top_infill_extrusion_width = 0.4
seam_position = aligned
overhangs = 1
support_material = 0
support_material_auto = 0
support_material_threshold = 45
brim_type = no_brim
brim_width = 0
skirts = 1
skirt_distance = 2
skirt_height = 1
elefant_foot_compensation = 0.2
# SPEC 12.5: updated automatically when three consecutive parts deviate the
# same way, and the change is written to audit_log. Hand edits are allowed;
# the next systematic deviation moves it again from wherever it stands.
xy_size_compensation = 0
perimeter_speed = 60
external_perimeter_speed = 35
infill_speed = 100
solid_infill_speed = 80
top_solid_infill_speed = 45
bridge_speed = 30
travel_speed = 200
first_layer_speed = 25
bridge_flow_ratio = 1

# ----------------------------------------------------------------- filament
filament_type = PLA
filament_density = 1.24
filament_cost = 600
temperature = 215
first_layer_temperature = 215
bed_temperature = 60
first_layer_bed_temperature = 60
extrusion_multiplier = 0.98
filament_max_volumetric_speed = 15
# Full cooling: crisp overhangs matter more than layer strength on a draft part.
cooling = 1
fan_always_on = 1
min_fan_speed = 100
max_fan_speed = 100
bridge_fan_speed = 100
disable_fan_first_layers = 1
slowdown_below_layer_time = 10
min_print_speed = 15
filament_notes = Draft only (SPEC 12.4). Open chamber, brass nozzle, no drying needed. Not for any part that carries load or sees the sun.
