#
# NEML_SPEC.md 12.4 - PA6-CF, 0.20 mm layer, high-load structural parts.
#   prusa-slicer --export-gcode --load pa6cf_0.20_structural.ini --output out.gcode in.3mf
#
# SPEC 12.3 MANDATORY EQUIPMENT for this material - the DFM check adds all three
# to the BOM as soon as PA6-CF is selected, and the print must not be started
# without them:
#   1. HARDENED NOZZLE (0.4 mm, hardened steel / ruby). Carbon fibre eats brass
#      in a few hundred grams; a worn nozzle silently widens every extrusion and
#      the 1.2 mm minimum wall stops being what the slicer thinks it is.
#   2. DRYING. PA6 is the most hygroscopic material in this library. 80 C for
#      8 h before the print, and printed from a dry box. Wet PA6-CF foams,
#      loses most of its layer adhesion and the part is scrap.
#   3. ENCLOSED CHAMBER, 40-60 C. Open-air PA6 warps off the bed and delaminates.
#
# SPEC 12.3 consistency:
#   min wall 1.2 mm   <- 4 perimeters x 0.45 mm = 1.80 mm of solid wall
#   nozzle 0.4 mm     <- nozzle_diameter (hardened, see above)
#   volume 250x210x220 <- bed_shape + max_print_height
# Purpose: structural, high load. Stiffest and most heat-resistant material
# here; used where PETG creeps - joint brackets, motor mounts, leg links.

print_settings_id = neml_pa6cf_0.20_structural
filament_settings_id = neml_pa6cf
printer_settings_id = neml_mk4_0.4_hardened

# ------------------------------------------------------------------ printer
printer_technology = FFF
printer_model = MK4
printer_notes = HARDENED NOZZLE REQUIRED (SPEC 12.3). Enclosure fitted, chamber 40-60 C.
gcode_flavor = marlin2
nozzle_diameter = 0.4
bed_shape = 0x0,250x0,250x210,0x210
max_print_height = 220
min_layer_height = 0.07
max_layer_height = 0.3
filament_diameter = 1.75
use_relative_e_distances = 1
# Short, slow retraction: CF-filled melt is abrasive and grinds easily.
retract_length = 0.6
retract_speed = 25
retract_lift = 0.2
retract_before_travel = 2
start_gcode = M104 S[first_layer_temperature]\nM140 S[first_layer_bed_temperature]\nM190 S[first_layer_bed_temperature]\nM109 S[first_layer_temperature]\nG28 ; home\nG29 ; mesh bed levelling\nG92 E0
end_gcode = M104 S0\nM140 S0\nG1 X0 Y200 F3000\nM84

# -------------------------------------------------------------------- print
layer_height = 0.2
first_layer_height = 0.2
perimeters = 4
perimeter_generator = arachne
thin_walls = 1
gap_fill_enabled = 1
min_feature_size = 0.4
top_solid_layers = 6
bottom_solid_layers = 5
fill_density = 50%
fill_pattern = gyroid
top_fill_pattern = monotonic
bottom_fill_pattern = monotonic
extrusion_width = 0.45
first_layer_extrusion_width = 0.45
perimeter_extrusion_width = 0.45
external_perimeter_extrusion_width = 0.45
infill_extrusion_width = 0.45
solid_infill_extrusion_width = 0.45
top_infill_extrusion_width = 0.4
seam_position = aligned
overhangs = 1
support_material = 0
support_material_auto = 0
support_material_threshold = 45
# Brim, because PA6 lifts corners even inside an enclosure.
brim_type = outer_only
brim_width = 6
skirts = 1
skirt_distance = 3
skirt_height = 2
elefant_foot_compensation = 0.2
# SPEC 12.5: updated automatically when three consecutive parts deviate the
# same way, and the change is written to audit_log. Hand edits are allowed;
# the next systematic deviation moves it again from wherever it stands.
xy_size_compensation = 0
perimeter_speed = 35
external_perimeter_speed = 25
infill_speed = 45
solid_infill_speed = 40
top_solid_infill_speed = 30
bridge_speed = 20
travel_speed = 150
first_layer_speed = 20
bridge_flow_ratio = 1

# ----------------------------------------------------------------- filament
filament_type = PA
# SPEC 13.3 mechanical.material_density_g_cm3 for PA6-CF. The genome and the
# slicer have to agree or every filament weight and every mass check drifts.
filament_density = 1.17
filament_cost = 600
temperature = 285
first_layer_temperature = 285
bed_temperature = 100
first_layer_bed_temperature = 100
extrusion_multiplier = 1
filament_max_volumetric_speed = 6
# Almost no part cooling: PA6 needs the heat to fuse layers. The fan exists only
# for the few bridges the DFM rules still allow (<= 10 mm).
cooling = 1
fan_always_on = 0
min_fan_speed = 0
max_fan_speed = 20
bridge_fan_speed = 40
disable_fan_first_layers = 4
slowdown_below_layer_time = 25
min_print_speed = 15
filament_notes = SPEC 12.3 MANDATORY: hardened 0.4 mm nozzle + drying 80 C / 8 h + enclosed chamber 40-60 C. All three go on the BOM automatically when PA6-CF is chosen. Anneal finished load-bearing parts 2 h at 80 C.
