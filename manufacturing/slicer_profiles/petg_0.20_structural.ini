#
# NEML_SPEC.md 12.4 - PETG, 0.20 mm layer, structural parts (the default).
# Load it with the CLI, never by embedding PrusaSlicer (AGPL, SPEC 1.3):
#   prusa-slicer --export-gcode --load petg_0.20_structural.ini --output out.gcode in.3mf
#
# SPEC 12.3 consistency:
#   min wall 1.2 mm   <- 3 perimeters x 0.45 mm = 1.35 mm of solid wall
#   nozzle 0.4 mm     <- nozzle_diameter below; min_feature_size ties the
#                        "smallest detail >= nozzle" rule to the slicer
#   volume 250x210x220 <- bed_shape + max_print_height below
#   support angle 45  <- support_material_threshold; supports stay OFF, the DFM
#                        check rejects the geometry instead of propping it up
# Purpose: structural. Tough, no warp, prints on an open machine - this is the
# material every load-bearing part uses unless heat or UV rules it out.

print_settings_id = neml_petg_0.20_structural
filament_settings_id = neml_petg
printer_settings_id = neml_mk4_0.4

# ------------------------------------------------------------------ printer
printer_technology = FFF
printer_model = MK4
gcode_flavor = marlin2
nozzle_diameter = 0.4
bed_shape = 0x0,250x0,250x210,0x210
max_print_height = 220
min_layer_height = 0.07
max_layer_height = 0.3
filament_diameter = 1.75
use_relative_e_distances = 1
retract_length = 0.8
retract_speed = 35
retract_lift = 0.2
retract_before_travel = 1.5
start_gcode = M104 S[first_layer_temperature]\nM140 S[first_layer_bed_temperature]\nM190 S[first_layer_bed_temperature]\nM109 S[first_layer_temperature]\nG28 ; home\nG29 ; mesh bed levelling\nG92 E0
end_gcode = M104 S0\nM140 S0\nG1 X0 Y200 F3000\nM84

# -------------------------------------------------------------------- print
layer_height = 0.2
first_layer_height = 0.2
perimeters = 3
perimeter_generator = arachne
thin_walls = 1
gap_fill_enabled = 1
min_feature_size = 0.4
top_solid_layers = 5
bottom_solid_layers = 4
fill_density = 40%
fill_pattern = gyroid
top_fill_pattern = monotonic
bottom_fill_pattern = monotonic
extrusion_width = 0.45
first_layer_extrusion_width = 0.42
perimeter_extrusion_width = 0.45
external_perimeter_extrusion_width = 0.45
infill_extrusion_width = 0.45
solid_infill_extrusion_width = 0.45
top_infill_extrusion_width = 0.4
seam_position = aligned
overhangs = 1
support_material = 0
support_material_auto = 0
support_material_threshold = 45
brim_type = no_brim
brim_width = 0
skirts = 1
skirt_distance = 2
skirt_height = 1
elefant_foot_compensation = 0.2
# SPEC 12.5: updated automatically when three consecutive parts deviate the
# same way, and the change is written to audit_log. Hand edits are allowed;
# the next systematic deviation moves it again from wherever it stands.
xy_size_compensation = 0
perimeter_speed = 45
external_perimeter_speed = 25
infill_speed = 60
solid_infill_speed = 50
top_solid_infill_speed = 35
bridge_speed = 25
travel_speed = 180
first_layer_speed = 20
bridge_flow_ratio = 0.95

# ----------------------------------------------------------------- filament
filament_type = PETG
filament_density = 1.27
filament_cost = 600
temperature = 240
first_layer_temperature = 240
bed_temperature = 85
first_layer_bed_temperature = 85
extrusion_multiplier = 0.95
filament_max_volumetric_speed = 8
cooling = 1
fan_always_on = 1
min_fan_speed = 30
max_fan_speed = 50
bridge_fan_speed = 100
disable_fan_first_layers = 3
slowdown_below_layer_time = 20
min_print_speed = 15
filament_notes = NEML default structural material (SPEC 12.4). Open chamber, brass nozzle. Dry only if the spool has been open for weeks (PETG is mildly hygroscopic: 65 C / 4 h).
