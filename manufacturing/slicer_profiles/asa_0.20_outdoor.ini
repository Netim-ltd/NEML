#
# NEML_SPEC.md 12.4 - ASA, 0.20 mm layer, outdoor parts. Anything that lives in
# sunlight or rain: shells, covers, sensor hoods, foot pads on an outdoor robot.
#   prusa-slicer --export-gcode --load asa_0.20_outdoor.ini --output out.gcode in.3mf
#
# SPEC 12.3 consistency:
#   min wall 1.2 mm   <- 3 perimeters x 0.45 mm = 1.35 mm, and for an outdoor
#                        part the wall is also the weather seal: 5 top / 4 bottom
#                        solid layers so no infill cell is left open to water.
#   nozzle 0.4 mm     <- nozzle_diameter; min_feature_size holds the detail rule
#   volume 250x210x220 <- bed_shape + max_print_height
# Purpose: outdoor. ASA is the UV-stable member of the library - PETG yellows
# and embrittles in sunlight, PLA fails outright. It warps like ABS, so the
# enclosure, the brim and the near-zero fan below are not optional.

print_settings_id = neml_asa_0.20_outdoor
filament_settings_id = neml_asa
printer_settings_id = neml_mk4_0.4

# ------------------------------------------------------------------ printer
printer_technology = FFF
printer_model = MK4
printer_notes = Enclosure fitted. ASA emits styrene - ventilate the room, do not stand next to it.
gcode_flavor = marlin2
nozzle_diameter = 0.4
bed_shape = 0x0,250x0,250x210,0x210
max_print_height = 220
min_layer_height = 0.07
max_layer_height = 0.3
filament_diameter = 1.75
use_relative_e_distances = 1
retract_length = 0.8
retract_speed = 35
retract_lift = 0.2
retract_before_travel = 1.5
start_gcode = M104 S[first_layer_temperature]\nM140 S[first_layer_bed_temperature]\nM190 S[first_layer_bed_temperature]\nM109 S[first_layer_temperature]\nG28 ; home\nG29 ; mesh bed levelling\nG92 E0
end_gcode = M104 S0\nM140 S0\nG1 X0 Y200 F3000\nM84

# -------------------------------------------------------------------- print
layer_height = 0.2
first_layer_height = 0.2
perimeters = 3
perimeter_generator = arachne
thin_walls = 1
gap_fill_enabled = 1
min_feature_size = 0.4
top_solid_layers = 5
bottom_solid_layers = 4
fill_density = 35%
fill_pattern = gyroid
top_fill_pattern = monotonic
bottom_fill_pattern = monotonic
extrusion_width = 0.45
first_layer_extrusion_width = 0.45
perimeter_extrusion_width = 0.45
external_perimeter_extrusion_width = 0.45
infill_extrusion_width = 0.45
solid_infill_extrusion_width = 0.45
top_infill_extrusion_width = 0.4
seam_position = aligned
overhangs = 1
support_material = 0
support_material_auto = 0
support_material_threshold = 45
# Brim and a tall skirt: ASA corners lift, and the skirt holds the chamber warm.
brim_type = outer_only
brim_width = 5
skirts = 2
skirt_distance = 3
skirt_height = 3
elefant_foot_compensation = 0.2
# SPEC 12.5: updated automatically when three consecutive parts deviate the
# same way, and the change is written to audit_log. Hand edits are allowed;
# the next systematic deviation moves it again from wherever it stands.
xy_size_compensation = 0
perimeter_speed = 45
external_perimeter_speed = 25
infill_speed = 60
solid_infill_speed = 50
top_solid_infill_speed = 35
bridge_speed = 25
travel_speed = 180
first_layer_speed = 20
bridge_flow_ratio = 1

# ----------------------------------------------------------------- filament
filament_type = ASA
filament_density = 1.07
filament_cost = 600
temperature = 260
first_layer_temperature = 260
bed_temperature = 105
first_layer_bed_temperature = 110
extrusion_multiplier = 1
filament_max_volumetric_speed = 11
# Near-zero fan. Every percent of cooling costs layer adhesion and buys a warp.
cooling = 1
fan_always_on = 0
min_fan_speed = 0
max_fan_speed = 20
bridge_fan_speed = 30
disable_fan_first_layers = 4
slowdown_below_layer_time = 25
min_print_speed = 15
filament_notes = Outdoor / UV exposed parts (SPEC 12.4). Enclosure required for anything wider than ~80 mm. Dry 70 C / 4 h if the spool has been open. Ventilate: styrene fumes.
