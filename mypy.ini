# NEML_SPEC.md 18.2 gate 1 runs `mypy --strict brain/neml_brain` from the repo
# root, so the settings have to live here: mypy only reads a config file from
# the working directory, and brain/pyproject.toml is never the working
# directory in CI or in the pre-commit hook.

[mypy]
python_version = 3.12
strict = True

# APScheduler ships no py.typed marker and has no stub package.
[mypy-apscheduler.*]
ignore_missing_imports = True

# asyncpg ships no py.typed marker and has no stub package.
[mypy-asyncpg.*]
ignore_missing_imports = True
