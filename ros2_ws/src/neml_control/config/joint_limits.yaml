#
# joint_limits_interface values for quadruped_v2.
#
# The numbers come straight from the SS13.3 genome `limits` block, which that
# section closes to the evolution loop and says is enforced in code:
#     joint_torque_nm_max   : 2.5
#     joint_velocity_rads_max: 6.0
#
# This file is the ros2_control-side enforcement. It is the THIRD line of
# defence, and the weakest one - above it sit the STM32 compile-time torque
# constant and the hardware current comparator of SS5.1. Never relax a value
# here to make a controller converge.
#
# ponytail: one flat block repeated per joint instead of a generator. 16
# entries, generated by nobody, read by everybody. If the DOF count ever
# stops being 16, generate this from the genome instead of editing it.

joint_limits:
  fl_hip_yaw:   &neml_joint_limit
    has_position_limits: true
    min_position: -0.70     # rad
    max_position: 0.70      # rad
    has_velocity_limits: true
    max_velocity: 6.0       # rad/s  - SS13.3 joint_velocity_rads_max
    has_effort_limits: true
    max_effort: 2.5         # Nm     - SS13.3 joint_torque_nm_max
    has_acceleration_limits: true
    max_acceleration: 60.0  # rad/s^2 - sts3215 no-load spin-up, measured
    has_jerk_limits: false

  fr_hip_yaw: *neml_joint_limit
  rl_hip_yaw: *neml_joint_limit
  rr_hip_yaw: *neml_joint_limit

  fl_hip_pitch: &neml_hip_pitch_limit
    <<: *neml_joint_limit
    min_position: -1.60
    max_position: 1.60
  fr_hip_pitch: *neml_hip_pitch_limit
  rl_hip_pitch: *neml_hip_pitch_limit
  rr_hip_pitch: *neml_hip_pitch_limit

  fl_knee: &neml_knee_limit
    <<: *neml_joint_limit
    min_position: -2.40
    max_position: 0.00
  fr_knee: *neml_knee_limit
  rl_knee: *neml_knee_limit
  rr_knee: *neml_knee_limit

  fl_ankle: &neml_ankle_limit
    <<: *neml_joint_limit
    min_position: -1.40
    max_position: 1.40
  fr_ankle: *neml_ankle_limit
  rl_ankle: *neml_ankle_limit
  rr_ankle: *neml_ankle_limit
