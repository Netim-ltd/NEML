name: neml-panel
services:
  panel:
    image: nginxinc/nginx-unprivileged:alpine
    container_name: neml-panel
    restart: unless-stopped
    volumes:
      - /srv/neml/neml-panel.conf:/etc/nginx/conf.d/default.conf:ro
      - /srv/neml/web/current:/usr/share/nginx/html:ro
    networks: [proxy]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cpus: 0.25
    mem_limit: 128m
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1/"]
      interval: 20s
      timeout: 5s
      retries: 3

networks:
  proxy:
    external: true
    name: nginx-proxy-network
