# One-shot GPU training on a separate host. Never schedule this on the 1 CPU control node.
name: neml-lora
services:
  nightly:
    image: neml/lora-worker:local
    build:
      context: ..
      dockerfile: docker/lora/Dockerfile
    restart: "no"
    environment:
      NEML_FEEDBACK_EXPORT_URL: ${NEML_FEEDBACK_EXPORT_URL:-}
      NEML_TRAINING_EXPORT_KEY: ${NEML_TRAINING_EXPORT_KEY:-}
    volumes:
      - ${NEML_TRAINING_ROOT:?set absolute training root}:/training
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
