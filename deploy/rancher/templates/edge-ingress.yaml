{{- if .Values.edgeIngress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-model-transport
spec:
  {{- if .Values.edgeIngress.className }}
  ingressClassName: {{ .Values.edgeIngress.className | quote }}
  {{- end }}
  tls:
    - hosts: [{{ .Values.edgeIngress.host | quote }}]
      secretName: {{ .Values.edgeIngress.tlsSecretName | quote }}
  rules:
    - host: {{ .Values.edgeIngress.host | quote }}
      http:
        paths:
          {{- range list "/v1/platform/ticket-request" "/v1/platform/model-bundle" "/v1/platform/model-ack" }}
          - path: {{ . }}
            pathType: Exact
            backend:
              service:
                name: {{ $.Release.Name }}-brain
                port:
                  name: http
          {{- end }}
{{- end }}
