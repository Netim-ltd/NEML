apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-brain
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: neml-brain
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
