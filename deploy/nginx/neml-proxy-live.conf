# NEML_DOMAIN (the base host name, e.g. neml.example.com; its certificate lives in letsencrypt/live/<NEML_DOMAIN>) is filled in at deploy time:
#   envsubst '${NEML_DOMAIN}' < neml-proxy-live.conf > conf.d/neml.conf
server {
    listen 80;
    server_name panel.${NEML_DOMAIN} api.${NEML_DOMAIN} lab.${NEML_DOMAIN};
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name panel.${NEML_DOMAIN};
    ssl_certificate /etc/letsencrypt/live/${NEML_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${NEML_DOMAIN}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    location / {
        set $neml_panel http://neml-panel:80;
        proxy_pass $neml_panel;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.${NEML_DOMAIN};
    ssl_certificate /etc/letsencrypt/live/${NEML_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${NEML_DOMAIN}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location / {
        set $neml_api http://neml-api:8080;
        proxy_pass $neml_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name lab.${NEML_DOMAIN};
    ssl_certificate /etc/letsencrypt/live/${NEML_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${NEML_DOMAIN}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 16k;
    location ~ ^/v1/platform/(ticket-request|model-bundle|model-ack|feedback|feedback-export|operation/generate)$ {
        set $neml_brain http://neml-brain:8080;
        proxy_pass $neml_brain;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / { return 404; }
}
